name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test engine, bot, sim, session
        run: |
          set -o pipefail
          ./gradlew :engine:test :bot:test :sim:test :session:test --stacktrace 2>&1 | tee build-test.log

      - name: Ringkasan test
        if: always()
        run: |
          for m in engine bot sim session; do
            d="$m/build/test-results/test"
            if [ -d "$d" ]; then
              t=$(grep -ho 'tests="[0-9]*"' $d/*.xml | grep -o '[0-9]*' | paste -sd+ - | bc)
              f=$(grep -ho 'failures="[0-9]*"' $d/*.xml | grep -o '[0-9]*' | paste -sd+ - | bc)
              s=$(grep -ho 'skipped="[0-9]*"' $d/*.xml | grep -o '[0-9]*' | paste -sd+ - | bc)
              echo "::notice title=Test :$m::$t test, $f gagal, $s dilewati"
            fi
          done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('*/build/test-results/test/*.xml'):
              for tc in ET.parse(path).getroot().iter('testcase'):
                  for f in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (f.get('message') or f.text or '').replace('\n', ' ')[:600]
                      print(f"::error title={tc.get('classname')}::{tc.get('name')} — {msg}")
          PY

      - name: Validasi konten lewat CLI simulasi
        run: ./gradlew :sim:run --args="--validate"

      - name: Simulasi singkat (smoke test)
        run: ./gradlew :sim:run --args="--games 20 --players 4 --bots hard,hard,normal,normal --seed 42 --no-ab"

      - name: Build APK debug
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-app.log

      - name: Siapkan kunci rilis (bila secret tersedia)
        env:
          KS: ${{ secrets.LISBON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/lisbon.jks"
            echo "LISBON_KEYSTORE_FILE=$RUNNER_TEMP/lisbon.jks" >> "$GITHUB_ENV"
            echo "::notice title=Signing::APK rilis ditandatangani dengan kunci rilis"
          else
            echo "::notice title=Signing::Secret LISBON_KEYSTORE_BASE64 belum ada — APK rilis memakai kunci debug"
          fi

      - name: Build APK & AAB rilis (R8)
        env:
          LISBON_KEYSTORE_PASSWORD: ${{ secrets.LISBON_KEYSTORE_PASSWORD }}
          LISBON_KEY_ALIAS: ${{ secrets.LISBON_KEY_ALIAS }}
          LISBON_KEY_PASSWORD: ${{ secrets.LISBON_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee build-release.log

      - name: Test UI (Robolectric — permainan penuh dirender)
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee build-uitest.log

      - name: Ringkasan test UI
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              t += int(root.get('tests', 0)); f += int(root.get('failures', 0)) + int(root.get('errors', 0))
              for tc in root.iter('testcase'):
                  for x in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (x.get('message') or '').replace('\n', ' ')[:500]
                      lines = [l.strip() for l in (x.text or '').splitlines()]
                      stack = [l for l in lines if l.startswith('at ') and ('lisbon1944' in l or 'compose' in l)][:12]
                      print(f"::error title={tc.get('classname')}::{tc.get('name')} — {msg} || " + ' | '.join(stack))
          print(f"::notice title=Test :app::{t} test, {f} gagal")
          PY

      - name: Terbitkan tangkapan layar ke cabang screenshots
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ -d app/build/screenshots ] && [ -n "$(ls -A app/build/screenshots)" ]; then
            cd app/build/screenshots
            git init -q
            git checkout -q -b screenshots
            git add .
            git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Tangkapan layar ${GITHUB_SHA::7}"
            git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots
            echo "::notice title=Tangkapan layar::$(ls | wc -l) gambar di cabang screenshots"
          fi

      - name: Anotasi error kompilasi
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re
          seen = 0
          for log in glob.glob('build-*.log'):
              for line in open(log, errors='replace'):
                  m = re.match(r'^e: (?:file://)?(\S+?):(\d+):(\d+) (.*)', line.strip())
                  if m and seen < 40:
                      path = m.group(1).split('/game-1.0/')[-1].split('/Game-1.0/')[-1]
                      print(f"::error file={path},line={m.group(2)},col={m.group(3)}::{m.group(4)[:400]}")
                      seen += 1
                  elif seen < 40 and (line.startswith(('e: ', 'ERROR:')) or 'AAPT: error' in line or "What went wrong" in line):
                      print(f"::error title={log}::{line.strip()[:500]}")
                      seen += 1
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - uses: actions/upload-artifact@v4
        with:
          name: lisbon1944-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lisbon1944-release-apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lisbon1944-release-aab
          path: app/build/outputs/bundle/release/*.aab

  # Uji APK RILIS (R8) di emulator Android 12 + tangkapan layar perangkat sungguhan.
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APK rilis
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build-device.log

      - name: Jalankan di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: aosp_atd
          arch: x86_64
          channel: canary
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            timeout 180 adb install -r app/build/outputs/apk/release/app-release.apk
            timeout 900 python3 tools/device_smoke.py emu-shots 2>&1 | tee instrument.log
            adb logcat -d -s AndroidRuntime:E > emu-shots/crash-log.txt || true
            grep -q "^OK:" instrument.log

      - name: Ringkasan uji perangkat
        if: always()
        run: |
          if [ -f instrument.log ]; then
            tail -n 25 instrument.log | tr '\n' ' ' | sed 's/^/::notice title=Instrumentasi rilis::/'
            echo
          fi
          if [ -s emu-shots/crash-log.txt ]; then head -c 1500 emu-shots/crash-log.txt | tr '\n' ' ' | sed 's/^/::error title=Crash::/'; echo; fi

      - name: Terbitkan tangkapan layar perangkat
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ -d emu-shots ] && [ -n "$(ls -A emu-shots)" ]; then
            cd emu-shots
            git init -q
            git checkout -q -b screenshots-device
            git add .
            git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Tangkapan layar perangkat ${GITHUB_SHA::7}"
            git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots-device
          fi

      - name: Anotasi error kompilasi
        if: failure()
        run: |
          grep -E "^e: |ERROR:|What went wrong|R8:|Missing class" build-device.log | head -20 | sed 's/^/::error title=build-device::/' || true

