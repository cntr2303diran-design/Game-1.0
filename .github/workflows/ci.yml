name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test engine, bot, sim, session
        run: |
          set -o pipefail
          ./gradlew :engine:test :bot:test :sim:test :session:test --stacktrace 2>&1 | tee build-test.log

      - name: Ringkasan test
        if: always()
        run: |
          for m in engine bot sim session; do
            d="$m/build/test-results/test"
            if [ -d "$d" ]; then
              t=$(grep -ho 'tests="[0-9]*"' $d/*.xml | grep -o '[0-9]*' | paste -sd+ - | bc)
              f=$(grep -ho 'failures="[0-9]*"' $d/*.xml | grep -o '[0-9]*' | paste -sd+ - | bc)
              s=$(grep -ho 'skipped="[0-9]*"' $d/*.xml | grep -o '[0-9]*' | paste -sd+ - | bc)
              echo "::notice title=Test :$m::$t test, $f gagal, $s dilewati"
            fi
          done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('*/build/test-results/test/*.xml'):
              for tc in ET.parse(path).getroot().iter('testcase'):
                  for f in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (f.get('message') or f.text or '').replace('\n', ' ')[:600]
                      print(f"::error title={tc.get('classname')}::{tc.get('name')} — {msg}")
          PY

      - name: Validasi konten lewat CLI simulasi
        run: ./gradlew :sim:run --args="--validate"

      - name: Simulasi singkat (smoke test)
        run: ./gradlew :sim:run --args="--games 20 --players 4 --bots hard,hard,normal,normal --seed 42 --no-ab"

      - name: Build APK debug
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-app.log

      - name: Build APK rilis (R8)
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build-release.log

      - name: Test UI (Robolectric — permainan penuh dirender)
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee build-uitest.log

      - name: Ringkasan test UI
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              t += int(root.get('tests', 0)); f += int(root.get('failures', 0)) + int(root.get('errors', 0))
              for tc in root.iter('testcase'):
                  for x in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (x.get('message') or x.text or '').replace('\n', ' ')[:800]
                      print(f"::error title={tc.get('classname')}::{tc.get('name')} — {msg}")
          print(f"::notice title=Test :app::{t} test, {f} gagal")
          PY

      - name: Terbitkan tangkapan layar ke cabang screenshots
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ -d app/build/screenshots ] && [ -n "$(ls -A app/build/screenshots)" ]; then
            cd app/build/screenshots
            git init -q
            git checkout -q -b screenshots
            git add .
            git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Tangkapan layar ${GITHUB_SHA::7}"
            git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots
            echo "::notice title=Tangkapan layar::$(ls | wc -l) gambar di cabang screenshots"
          fi

      - name: Anotasi error kompilasi
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re
          seen = 0
          for log in glob.glob('build-*.log'):
              for line in open(log, errors='replace'):
                  m = re.match(r'^e: (?:file://)?(\S+?):(\d+):(\d+) (.*)', line.strip())
                  if m and seen < 40:
                      path = m.group(1).split('/game-1.0/')[-1].split('/Game-1.0/')[-1]
                      print(f"::error file={path},line={m.group(2)},col={m.group(3)}::{m.group(4)[:400]}")
                      seen += 1
                  elif seen < 40 and (line.startswith(('e: ', 'ERROR:')) or 'AAPT: error' in line or "What went wrong" in line):
                      print(f"::error title={log}::{line.strip()[:500]}")
                      seen += 1
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - uses: actions/upload-artifact@v4
        with:
          name: lisbon1944-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lisbon1944-release-apk
          path: app/build/outputs/apk/release/*.apk
