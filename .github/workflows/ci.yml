name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test engine, bot, sim
        run: ./gradlew :engine:test :bot:test :sim:test --stacktrace

      - name: Validasi konten lewat CLI simulasi
        run: ./gradlew :sim:run --args="--validate"

      - name: Build APK debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - uses: actions/upload-artifact@v4
        with:
          name: lisbon1944-debug-apk
          path: app/build/outputs/apk/debug/*.apk
